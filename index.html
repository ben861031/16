<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>榮譽榜生圖系統</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,0.3) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,0.3) 0, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 1.5rem 2rem;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            padding: 1.5rem;
            gap: 1.5rem;
        }

        .sidebar {
            width: 350px;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            overflow-y: auto;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .preview-area {
            flex: 1;
            background: rgba(0, 0, 0, 0.2);
            border: 1px dashed var(--border-color);
            border-radius: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: auto;
            position: relative;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-group label {
            font-size: 0.875rem;
            font-weight: 700;
            color: var(--text-muted);
        }

        .form-control {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(1px);
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        #canvas {
            max-width: 100%;
            max-height: calc(100vh - 180px);
            object-fit: contain;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border-radius: 4px;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
            margin-top: 1rem;
            margin-bottom: 0.5rem;
            color: #e2e8f0;
        }

        /* Customize Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.1);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255,255,255,0.3);
        }

        /* 手機版響應式設計 (RWD) */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                text-align: center;
                gap: 1rem;
            }
            .header h1 {
                font-size: 1.2rem;
            }
            .main-container {
                flex-direction: column;
                overflow-y: auto; /* 允許手機上下滑動 */
                padding: 1rem;
            }
            .preview-area {
                order: -1; /* 讓預覽圖跑到最上面 */
                min-height: 40vh;
                border: none;
                background: transparent;
            }
            #canvas {
                max-height: 45vh; /* 縮小畫布最高高度，留空間給下面的表單 */
            }
            .sidebar {
                width: 100%; /* 表單撐滿寬度 */
                box-sizing: border-box;
                box-shadow: none;
            }
        }

    </style>
</head>
<body onload="loadDefaultTemplate()">

    <header class="header">
        <h1>榮譽榜生圖系統</h1>
        <button class="btn btn-secondary" onclick="loadDefaultTemplate()">重新載入背景 (1000011200.jpg)</button>
    </header>

    <main class="main-container">
        <aside class="sidebar">
            
            <div class="form-group" style="display:none;">
                <label>背景圖片</label>
                <input type="file" id="imageUpload" class="form-control" accept="image/*">
            </div>

            <div class="section-title">文字內容設定</div>
            
            <div class="form-group">
                <label>姓名</label>
                <input type="text" id="nameText" class="form-control" value="蔡 玉 娟" placeholder="例如: 蔡玉娟">
            </div>

            <div class="form-group" style="margin-top: 1rem;">
                <label>單位/部門</label>
                <input type="text" id="deptText" class="form-control" value="—— 盛峰推展處 ——" placeholder="例如: —— 盛峰推展處 ——">
            </div>

            <div class="form-group" style="margin-top: 1rem;">
                <label>數量/件數</label>
                <input type="text" id="qtyText" class="form-control" value="✦ 1 張 ✦" placeholder="例如: ✦ 1 張 ✦">
            </div>

            <button class="btn" onclick="downloadImage()" style="margin-top: 2rem;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                下載圖片
            </button>
            
            <p style="margin-top: 1rem; font-size: 0.85rem; color: var(--text-muted); line-height: 1.5;">
                提示：座標與文字樣式已為您固定在最佳位置。只需修改上述文字，即可下載生成的圖片。
            </p>
        </aside>

        <section class="preview-area">
            <canvas id="canvas"></canvas>
            <div id="placeholder" style="position: absolute; color: var(--text-muted); font-size: 1.2rem; display: flex; flex-direction: column; align-items: center; gap: 1rem;">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                正在載入預設圖片...
            </div>
        </section>
    </main>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let bgImage = null;

        const inputs = ['deptText', 'nameText', 'qtyText'];

        // Add event listeners to trigger redraw
        inputs.forEach(id => {
            document.getElementById(id).addEventListener('input', drawImage);
        });

        document.getElementById('imageUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    loadImage(event.target.result);
                };
                reader.readAsDataURL(file);
            }
        });

        function loadImage(src) {
            const img = new Image();
            img.onload = function() {
                bgImage = img;
                canvas.width = img.width;
                canvas.height = img.height;
                document.getElementById('placeholder').style.display = 'none';
                drawImage();
            };
            img.onerror = function() {
                alert('無法載入預設圖片。請確保您已將 1000011200.jpg 放在同一目錄下。');
            }
            img.src = src;
        }

        function drawImage() {
            if (!bgImage) return;

            // Clear and draw background
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(bgImage, 0, 0);

            const centerX = canvas.width / 2;

            // --- 繪製「姓名」 ---
            // 稍微往上移一點
            drawGoldText(document.getElementById('nameText').value, centerX, 670, 150, '700');

            // --- 繪製「單位/部門」 ---
            // 往下移，拉開與姓名的距離
            drawGoldText(document.getElementById('deptText').value, centerX, 830, 60, '700');

            // --- 繪製「數量/件數」 ---
            // 稍微往下移
            drawQuantity(document.getElementById('qtyText').value, centerX, 990, 190);
        }

        function drawQuantity(text, x, y, size) {
            const hasStars = text.includes('✦');
            if (hasStars) {
                const innerText = text.replace(/✦/g, '').trim();
                drawGoldText(innerText, x, y, size, '900');
                
                ctx.font = `900 ${size}px 'Noto Sans TC', sans-serif`;
                const textWidth = ctx.measureText(innerText).width;
                
                const starOffset = (textWidth / 2) + 60;
                drawGoldText('✦', x - starOffset, y - 20, size * 0.45, '400');
                drawGoldText('✦', x + starOffset, y - 20, size * 0.45, '400');
            } else {
                drawGoldText(text, x, y, size, '900');
            }
        }

        function drawGoldText(text, x, y, size, weight) {
            ctx.font = `${weight} ${size}px 'Noto Sans TC', sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // 建立金屬漸層效果 (改成非常明亮、乾淨的黃金，去除厚重的暗色)
            const gradient = ctx.createLinearGradient(0, y - size/2, 0, y + size/2);
            gradient.addColorStop(0, '#FFFFFF'); // 頂部純白高光
            gradient.addColorStop(0.2, '#FFF4B8'); // 極亮白金
            gradient.addColorStop(0.5, '#FFD700'); // 正黃金
            gradient.addColorStop(0.8, '#F0A500'); // 亮橘金
            gradient.addColorStop(1, '#995C00'); // 底部收尾的暖金 (避免變黑)
            
            // 邊框 (改成較細且較亮的暖咖啡色，避免整體暗沉)
            ctx.strokeStyle = '#5E3006';
            ctx.lineWidth = Math.max(2, size * 0.015);
            ctx.lineJoin = 'round';
            
            // 1. 繪製帶有明亮光暈的邊框
            ctx.shadowColor = 'rgba(255, 180, 0, 0.5)'; // 明亮的黃色光暈
            ctx.shadowBlur = 20;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;
            ctx.strokeText(text, x, y);

            // 2. 繪製底部陰影，創造立體感但不要太髒
            ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
            ctx.shadowBlur = 10;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = size * 0.05;
            ctx.strokeText(text, x, y);

            // 3. 繪製文字漸層本體
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
            ctx.fillStyle = gradient;
            ctx.fillText(text, x, y);
            
            // 4. 疊加微弱的頂部亮邊 (讓字體看起來更光亮)
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.fillText(text, x, y - 2);
        }

        function downloadImage() {
            if (!bgImage) {
                alert('請先載入圖片！');
                return;
            }
            const dataURL = canvas.toDataURL('image/png');
            const link = document.createElement('a');
            
            // Generate filename based on template
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const date = now.getDate();
            let hours = now.getHours();
            const ampm = hours >= 12 ? '下午' : '上午';
            hours = hours % 12;
            hours = hours ? hours : 12; 
            const hoursStr = hours < 10 ? '0' + hours : hours;
            const minutes = now.getMinutes() < 10 ? '0' + now.getMinutes() : now.getMinutes();
            const seconds = now.getSeconds() < 10 ? '0' + now.getSeconds() : now.getSeconds();
            
            const filename = `ChatGPT Image ${year}年${month}月${date}日 ${ampm}${hoursStr}_${minutes}_${seconds}.png`;
            
            link.download = filename;
            link.href = dataURL;
            link.click();
        }
    </script>
